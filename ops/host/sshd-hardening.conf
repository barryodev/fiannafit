# SSH hardening. provision-host.sh installs it to
# /etc/ssh/sshd_config.d/01-hardening.conf; edit it here, never on the VM.
#
# sshd keeps the first value it reads for each setting, and reads the
# sshd_config.d/ files in name order, so the "01-" prefix makes these win
# over files like 50-cloud-init.conf.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
