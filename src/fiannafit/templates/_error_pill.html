{# Floats above the log panel (see .error-pill); stays until the problem is gone #}
{% if error %}
<p id="log-error" class="error-pill" role="alert">
  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 13h2V7h-2v6Zm1 4a1 1 0 1 0 0-2 1 1 0 0 0 0 2Zm0 5a10 10 0 1 1 0-20 10 10 0 0 1 0 20Z"/></svg>
  {{ error.message }}
</p>
{% endif %}
